<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynasty Dashboard</title>
  <link rel="stylesheet" href="./styles.css?v=draft-pick-ranges">
</head>
<body>
<main>
  <header>
    <div class="header-sync">
      <button id="sync-data" type="button">Sync Data</button>
      <span id="sync-status" role="status"></span>
    </div>
    <div class="eyebrow">Dynasty Dashboard</div>
    <h1 id="league"></h1>
    <p id="season"></p>
  </header>
  <nav aria-label="Dashboard views">
    <button data-view="standings" aria-current="page">Standings</button>
    <button data-view="matchups">Matchups</button>
    <button data-view="teams">Teams</button>
    <button data-view="draft">Draft</button>
    <button data-view="playoffs">Playoffs</button>
    <button data-view="methodology">Methodology</button>
    <button data-view="values" hidden>Trade Values</button>
  </nav>
  <section id="content" aria-label="Dashboard data"></section>
  <footer id="updated"></footer>
</main>
<script src="./dashboard.js?v=draft-pick-ranges" defer></script>
</body>
</html>
