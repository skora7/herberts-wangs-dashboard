name: Refresh and publish dashboard

on:
  schedule:
    - cron: '48 2,14 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh snapshots
        run: python build.py
      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sleeper.json data/projections.json data/lineups.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dashboard snapshots"
            git push origin "HEAD:${GITHUB_REF}"
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html styles.css dashboard.js sync-worker.js build.py _site/
          cp data/sleeper.json data/projections.json data/lineups.json _site/data/
          if [ -f ktc_snapshot.json ]; then
            cp ktc_snapshot.json _site/
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
